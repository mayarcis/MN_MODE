<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Fashion | Wishlist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/wishlist.css">
</head>

<body>

    <header class="main-header">
        <nav class="navbar">
            <div class="container-fluid px-lg-5">

                <a class="navbar-brand" href="home.html">
                    <span class="logo">MN</span>
                    <span class="brand-name">FASHION</span>
                </a>

                <div class="nav-actions">
                    <a href="men_shirts.html" class="icon-btn">
                        <i class="bi bi-arrow-left"></i>
                    </a>

                    <a href="wishlist.html" class="icon-btn">
                        <i class="bi bi-heart-fill"></i>
                        <span class="cart-count" id="wishlistCount">0</span>
                    </a>
                </div>

            </div>
        </nav>
    </header>

    <main class="wishlist-section">

        <div class="container">

            <div class="wishlist-heading">
                <span>YOUR COLLECTION</span>
                <h1>My Wishlist</h1>
                <p>All your favorite products in one place.</p>
            </div>

            <div class="row g-4" id="wishlistGrid"></div>

            <div class="empty-wishlist" id="emptyWishlist">
                <i class="bi bi-heart"></i>
                <h3>Your wishlist is empty</h3>
                <p>Save your favorite products to see them here.</p>
                <a href="men_shirts.html">Explore Shirts</a>
            </div>

        </div>

    </main>

    <script src="../js/wishlist.js"></script>
    <script src="../js/home.js"></script>

</body>
</html>
