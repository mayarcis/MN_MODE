<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Fashion | Contact Us</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>

    <header class="main-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid px-lg-5">

                <a class="navbar-brand" href="../html/home.html">
                    <span class="logo">MN</span>
                    <span class="brand-name">FASHION</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                    <i class="bi bi-list"></i>
                </button>

         </div>
        </nav>
    </header>
    <!-- Contact Section -->
    <section class="contact-section">

        <div class="container">



            <div class="row g-5 align-items-center">

                <!-- Contact Form -->
                <div class="col-lg-5">

                    <div class="contact-form">

                        <h3>Send Us a Message</h3>

                        <form id="contactForm">

                            <div class="mb-4">
                                <label for="userName">Your Name</label>
                                <input type="text" id="userName" class="form-control" placeholder="Enter your name"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="userEmail">Your Email</label>
                                <input type="email" id="userEmail" class="form-control" placeholder="Enter your email"
                                    required>
                            </div>

                            <button type="submit" class="contact-btn">
                                Send Message
                            </button>

                            <p id="successMessage"></p>

                        </form>

                    </div>

                </div>

                <!-- Map -->
                <div class="col-lg-7">

                    <div class="contact-map">

                        <h3>Our Location</h3>

                        <iframe src="https://www.google.com/maps?q=Istanbul,Turkey&output=embed" width="100%"
                            height="400" style="border:0;" allowfullscreen="" loading="lazy">
                        </iframe>

                        <p>
                            <i class="bi bi-geo-alt"></i>
                            Istanbul, Turkey
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">

        <div class="text-center">

        </div>
        <p>© 2026 MN Fashion. All Rights Reserved.</p>
        </div>


    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/contact.js"></script>

</body>

</html>
